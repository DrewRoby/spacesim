[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacesim-models"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pymc>=5.0",
    "factor-analyzer>=0.5",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "hdbscan>=0.8",
    "pydantic>=2.0",    # Strict dataclasses for all state objects
    "tomllib",          # Reading /data TOML configs (stdlib in 3.11+)
]
