# Grain commodities — primary satisfiers of carbohydrate and calorie needs.

[[commodity]]
id          = "grain"
name        = "Grain"
description = "Raw cereal grain (wheat, rice, maize). Requires processing before consumption."
[commodity.satisfies]
carbohydrates = 0.80
calories      = 0.65
protein       = 0.10
fiber         = 0.20

[[commodity]]
id          = "bread"
name        = "Bread"
description = "Processed grain loaf. Ready to eat — higher bioavailability than raw grain."
[commodity.satisfies]
carbohydrates = 0.75
calories      = 0.60
protein       = 0.12
fiber         = 0.15

[[commodity]]
id          = "pasta"
name        = "Pasta"
description = "Extruded wheat dough. Dense caloric staple."
[commodity.satisfies]
carbohydrates = 0.80
calories      = 0.70
protein       = 0.14
fiber         = 0.10

[[commodity]]
id          = "rice"
name        = "Rice"
description = "Polished or whole grain rice. Low fiber unless unpolished."
[commodity.satisfies]
carbohydrates = 0.85
calories      = 0.68
fiber         = 0.08
